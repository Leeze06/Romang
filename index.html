<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로망 · ROMANG</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12213f">
<link rel="icon" type="image/png" href="assets/romang-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root {
    --cream: #f4ebd8;
    --canvas: #ffffff;
    --soft: #faf6ec;
    --ink: #181d26;
    --body: #333840;
    --muted: #5f6670;
    --hair: #e7ddc9;
    --hair-strong: #b6ab92;
    --label: #9a917f;
    --navy: #12213f;
    --gold: #d9b25a;
    --gold-soft: #f2e2b6;
    --forest: #0b7a4f;
    --peach: #fcab79;
    --mint: #a8d8c4;
    --link: #1c3a6e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
  }
  a { text-decoration: none; color: inherit; }
  a.txtlink { color: var(--link); }
  a.txtlink:hover { color: #14315f; }

  .wrap {
    width: 100%;
    max-width: 460px;
    padding: 40px 22px 40px;
    display: flex;
    flex-direction: column;
  }

  /* Navy hero */
  .hero {
    background: var(--navy);
    border-radius: 16px;
    padding: 30px 24px 28px;
    text-align: center;
    color: #fff;
    box-shadow: 0 16px 40px rgba(18,33,63,0.20);
  }
  .hero .emblem {
    width: 67px; height: auto; display: block; margin: 0 auto 6px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
  }
  .hero .wordmark {
    font-size: 26px; font-weight: 800; letter-spacing: 5px;
    color: var(--gold-soft);
  }
  .hero .tagline {
    margin-top: 9px; font-size: 13px; color: #c7cdd6; letter-spacing: .5px;
  }
  .hero .livestat {
    margin-top: 16px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 13px; border-radius: 999px;
    background: rgba(217,178,90,0.12); border: 1px solid rgba(242,226,182,0.32);
    font-size: 12px; color: var(--gold-soft); font-weight: 500; white-space: nowrap;
  }
  .hero .livestat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

  .links { margin-top: 18px; width: 100%; display: flex; flex-direction: column; gap: 12px; }

  .link {
    display: flex; align-items: center; gap: 15px;
    padding: 18px;
    background: var(--canvas);
    border: 1px solid var(--hair);
    border-radius: 12px;
    color: inherit;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .link:hover {
    transform: translateY(-2px);
    border-color: var(--hair-strong);
    box-shadow: 0 12px 26px rgba(18,33,63,0.10);
  }
  .icon {
    width: 46px; height: 46px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
  }
  .icon.event { background: var(--peach); }
  .icon.ranking { background: var(--mint); }
  .icon.guild { background: var(--gold-soft); }
  .icon svg { width: 22px; height: 22px; display: block; }

  .body { flex: 1; min-width: 0; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .title { font-size: 17px; font-weight: 600; color: var(--ink); }
  .desc { margin-top: 3px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .badge {
    font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--forest); color: #fff;
  }
  .chev { color: var(--hair-strong); flex-shrink: 0; transition: transform .15s ease; }
  .link:hover .chev { transform: translateX(3px); }

  button.link { width: 100%; text-align: left; font: inherit; appearance: none; -webkit-appearance: none; cursor: pointer; }
  .lockbadge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
    padding: 2px 8px; border-radius: 999px;
    color: var(--muted); background: var(--soft); border: 1px solid var(--hair);
  }
  .lockbadge svg { width: 10px; height: 10px; }

  .foot {
    margin-top: 34px; text-align: center;
    font-size: 10px; color: var(--label);
    letter-spacing: 2px; text-transform: uppercase;
  }

  /* Password modal — light */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(20, 24, 32, 0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .modal-backdrop.show { display: flex; animation: fadein .16s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    position: relative;
    width: 100%; max-width: 340px;
    background: var(--canvas); border: 1px solid var(--hair);
    border-radius: 16px; padding: 30px 24px 24px;
    text-align: center;
    box-shadow: 0 28px 70px rgba(18,33,63,0.35);
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: translateY(10px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal.shake { animation: shake .35s; }
  @keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }
  .modal-x {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px; border-radius: 8px;
    background: transparent; border: none; cursor: pointer;
    color: var(--label); font-size: 22px; line-height: 1;
  }
  .modal-x:hover { color: var(--ink); background: var(--soft); }
  .modal-emblem { height: 58px; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(18,33,63,0.28)); }
  .modal-title { display: flex; align-items: center; justify-content: center; gap: 7px; margin-bottom: 6px; }
  .modal-title span { font-size: 18px; font-weight: 700; color: var(--ink); }
  .modal-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
  #guildPw {
    width: 100%; box-sizing: border-box;
    padding: 12px 14px; border-radius: 10px;
    background: var(--soft); color: var(--ink);
    border: 1px solid var(--hair);
    font-size: 16px; text-align: center; letter-spacing: 4px;
    font-family: 'JetBrains Mono', monospace; outline: none;
  }
  #guildPw:focus { border-color: var(--navy); }
  .modal-err { display: none; margin-top: 10px; font-size: 12px; color: #c0392b; font-weight: 600; }
  .modal-err.show { display: block; }
  .modal-go {
    margin-top: 18px; width: 100%;
    padding: 12px 14px; border-radius: 10px; border: none;
    background: var(--navy);
    color: var(--gold-soft); font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .modal-go:disabled { opacity: 0.55; cursor: default; }

  @media (max-width: 420px) {
    .wrap { padding-top: 28px; }
    .link { padding: 16px 14px; gap: 13px; }
    .icon { width: 42px; height: 42px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img class="emblem" src="assets/romang-emblem.png" alt="Romang">
    <div class="wordmark">ROMANG</div>
    <div class="tagline">로망 랭크전 현황표</div>
    <div class="livestat"><span class="dot"></span>S18</div>
  </div>

  <div class="links">
    <a class="link" href="event.html">
      <span class="icon event">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/><path d="M12 8C12 8 11 3 8 3a2.5 2.5 0 0 0 0 5zM12 8c0 0 1-5 4-5a2.5 2.5 0 0 1 0 5z"/></svg>
      </span>
      <div class="body">
        <div class="title-row"><span class="title">이벤트</span><span class="badge">진행중</span></div>
        <div class="desc">7/13 ~ 8/2 3주간 진행</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a class="link" href="ranking.html">
      <span class="icon ranking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      </span>
      <div class="body">
        <div class="title-row"><span class="title">랭킹</span></div>
        <div class="desc">누적 승률 순위</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <button class="link" id="guildLink" type="button">
      <span class="icon guild">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
      </span>
      <div class="body">
        <div class="title-row"><span class="title">길랭표</span><span class="lockbadge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>관리자</span></div>
        <div class="desc">주차별 길드전 판수 기록</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="foot">로망 랭크전 현황표</div>
</div>

<div class="modal-backdrop" id="guildModal" aria-hidden="true">
  <form class="modal" id="guildForm">
    <button type="button" class="modal-x" id="guildClose" aria-label="닫기">×</button>
    <img src="assets/romang-emblem.png" alt="Romang" class="modal-emblem">
    <div class="modal-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1c3a6e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>길랭표 잠금</span>
    </div>
    <div class="modal-desc">관리자 전용 페이지입니다. 비밀번호를 입력해 주세요.</div>
    <input id="guildPw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호">
    <div class="modal-err" id="guildErr">비밀번호가 올바르지 않습니다.</div>
    <button type="submit" class="modal-go" id="guildGo">입장</button>
  </form>
</div>

<script src="shared/auth.js"></script>
<script>
  (function () {
    var modal = document.getElementById('guildModal');
    var form = document.getElementById('guildForm');
    var input = document.getElementById('guildPw');
    var err = document.getElementById('guildErr');
    var go = document.getElementById('guildGo');

    function open() {
      if (window.RomangAuth && window.RomangAuth.isAuthed()) { location.href = 'guild.html'; return; }
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
      err.classList.remove('show');
      input.value = '';
      setTimeout(function () { input.focus(); }, 50);
    }
    function close() {
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
    }
    async function submit(e) {
      e.preventDefault();
      if (go.disabled) return;
      go.disabled = true; go.textContent = '확인 중…';
      var ok = window.RomangAuth ? await window.RomangAuth.verify(input.value) : false;
      go.disabled = false; go.textContent = '입장';
      if (ok) { window.RomangAuth.setAuthed(); location.href = 'guild.html'; }
      else {
        err.classList.add('show');
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        input.value = ''; input.focus();
      }
    }

    document.getElementById('guildLink').addEventListener('click', open);
    document.getElementById('guildClose').addEventListener('click', close);
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    form.addEventListener('submit', submit);
    input.addEventListener('input', function () { err.classList.remove('show'); });
  })();
</script>

</body>
</html>
