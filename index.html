<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로망 · ROMANG</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<link rel="icon" type="image/png" href="assets/romang-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root {
    --bg: #0a1220;
    --panel: #0f1a2e;
    --panel2: #13243d;
    --line: rgba(120,180,255,0.10);
    --line2: rgba(120,180,255,0.18);
    --text: #dbe8ff;
    --dim: #7a8bad;
    --label: #5e7194;
    --cyan: #5ad9ff;
    --green: #22d39a;
    --yellow: #f5c244;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background-image:
      radial-gradient(circle at 15% -5%, rgba(90,217,255,0.10), transparent 45%),
      radial-gradient(circle at 90% 105%, rgba(34,211,154,0.08), transparent 45%);
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 56px 22px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .emblem {
    width: 168px; height: auto; display: block;
    margin-bottom: 22px;
    filter: drop-shadow(0 12px 28px rgba(0,0,0,0.55));
  }
  .wordmark {
    font-family: 'Pretendard Variable', sans-serif;
    font-size: 30px; font-weight: 800; letter-spacing: 5px;
    color: var(--text);
  }
  .tagline {
    margin-top: 8px; font-size: 13px; color: var(--dim);
    letter-spacing: 1px; white-space: nowrap;
  }
  .livestat {
    margin-top: 14px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 11px; color: var(--label);
    font-family: 'JetBrains Mono', monospace; white-space: nowrap;
  }
  .livestat .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

  .links { margin-top: 24px; width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .link {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-decoration: none; color: inherit;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    position: relative;
    overflow: hidden;
  }
  .link::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: 0; transition: opacity .15s ease;
  }
  .link:hover {
    transform: translateY(-2px);
    border-color: var(--line2);
    background: var(--panel2);
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .link:hover::before { opacity: 1; }

  .icon {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent);
  }
  .icon svg { width: 22px; height: 22px; display: block; }

  .body { flex: 1; min-width: 0; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .title { font-size: 16px; font-weight: 700; color: var(--text); }
  .desc { margin-top: 3px; font-size: 12px; color: var(--dim); line-height: 1.4; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    padding: 2px 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--green) 16%, transparent);
    color: var(--green);
    border: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
  }
  .chev { color: var(--label); flex-shrink: 0; transition: transform .15s ease, color .15s ease; }
  .link:hover .chev { transform: translateX(3px); color: var(--accent); }

  .foot {
    margin-top: 40px; text-align: center;
    font-size: 10px; color: var(--label);
    letter-spacing: 2px; text-transform: uppercase;
  }

  /* 길랭표 card is a <button>; reset native styles to match the <a> links */
  button.link { width: 100%; text-align: left; font: inherit; appearance: none; -webkit-appearance: none; }
  .lockbadge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
    padding: 2px 7px; border-radius: 999px;
    color: var(--cyan);
    background: color-mix(in srgb, var(--cyan) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--cyan) 35%, transparent);
  }
  .lockbadge svg { width: 10px; height: 10px; }

  /* Password modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(4, 8, 16, 0.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .modal-backdrop.show { display: flex; animation: fadein .16s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    position: relative;
    width: 100%; max-width: 340px;
    background: var(--panel); border: 1px solid var(--line2);
    border-radius: 18px; padding: 30px 24px 24px;
    text-align: center;
    box-shadow: 0 28px 70px rgba(0,0,0,0.55);
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: translateY(10px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal.shake { animation: shake .35s; }
  @keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }
  .modal-x {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px; border-radius: 8px;
    background: transparent; border: none; cursor: pointer;
    color: var(--label); font-size: 22px; line-height: 1;
  }
  .modal-x:hover { color: var(--text); background: var(--panel2); }
  .modal-emblem { height: 60px; margin-bottom: 12px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5)); }
  .modal-title { display: flex; align-items: center; justify-content: center; gap: 7px; margin-bottom: 6px; }
  .modal-title span { font-size: 18px; font-weight: 800; color: var(--text); }
  .modal-desc { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin-bottom: 18px; }
  #guildPw {
    width: 100%; box-sizing: border-box;
    padding: 12px 14px; border-radius: 10px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line2);
    font-size: 16px; text-align: center; letter-spacing: 4px;
    font-family: 'JetBrains Mono', monospace; outline: none;
  }
  #guildPw:focus { border-color: var(--cyan); }
  .modal-err { display: none; margin-top: 10px; font-size: 12px; color: #ff5b7a; font-weight: 600; }
  .modal-err.show { display: block; }
  .modal-go {
    margin-top: 18px; width: 100%;
    padding: 12px 14px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--cyan), var(--green));
    color: #06121f; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .modal-go:disabled { opacity: 0.6; cursor: default; }

  @media (max-width: 420px) {
    .wrap { padding-top: 40px; }
    .emblem { width: 144px; }
    .link { padding: 16px 14px; gap: 13px; }
    .icon { width: 42px; height: 42px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <img class="emblem" src="assets/romang-emblem.png" alt="Romang">
  <div class="wordmark">ROMANG</div>

  <div class="links">
    <button class="link" id="guildLink" type="button" style="--accent: #5ad9ff;">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
      </span>
      <div class="body">
        <div class="title-row"><span class="title">길랭표</span><span class="lockbadge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>관리자</span></div>
        <div class="desc">주차별 길드전 판수·승패 기록</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <a class="link" href="event.html" style="--accent: #22d39a;">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/><path d="M12 8C12 8 11 3 8 3a2.5 2.5 0 0 0 0 5zM12 8c0 0 1-5 4-5a2.5 2.5 0 0 1 0 5z"/></svg>
      </span>
      <div class="body">
        <div class="title-row"><span class="title">이벤트</span><span class="badge">진행중</span></div>
        <div class="desc">6월 승점 이벤트 · 6/8–6/21 · 실시간 점수판</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a class="link" href="ranking.html" style="--accent: #f5c244;">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      </span>
      <div class="body">
        <div class="title-row"><span class="title">랭킹</span></div>
        <div class="desc">누적 승률 TOP</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
  </div>

  <div class="foot">로망 랭크전 현황표</div>
</div>

<div class="modal-backdrop" id="guildModal" aria-hidden="true">
  <form class="modal" id="guildForm">
    <button type="button" class="modal-x" id="guildClose" aria-label="닫기">×</button>
    <img src="assets/romang-emblem.png" alt="Romang" class="modal-emblem">
    <div class="modal-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5ad9ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>길랭표 잠금</span>
    </div>
    <div class="modal-desc">관리자 전용 페이지입니다. 비밀번호를 입력해 주세요.</div>
    <input id="guildPw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호">
    <div class="modal-err" id="guildErr">비밀번호가 올바르지 않습니다.</div>
    <button type="submit" class="modal-go" id="guildGo">입장</button>
  </form>
</div>

<script src="shared/auth.js"></script>
<script>
  (function () {
    var modal = document.getElementById('guildModal');
    var form = document.getElementById('guildForm');
    var input = document.getElementById('guildPw');
    var err = document.getElementById('guildErr');
    var go = document.getElementById('guildGo');

    function open() {
      if (window.RomangAuth && window.RomangAuth.isAuthed()) { location.href = 'guild.html'; return; }
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
      err.classList.remove('show');
      input.value = '';
      setTimeout(function () { input.focus(); }, 50);
    }
    function close() {
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
    }
    async function submit(e) {
      e.preventDefault();
      if (go.disabled) return;
      go.disabled = true; go.textContent = '확인 중…';
      var ok = window.RomangAuth ? await window.RomangAuth.verify(input.value) : false;
      go.disabled = false; go.textContent = '입장';
      if (ok) { window.RomangAuth.setAuthed(); location.href = 'guild.html'; }
      else {
        err.classList.add('show');
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        input.value = ''; input.focus();
      }
    }

    document.getElementById('guildLink').addEventListener('click', open);
    document.getElementById('guildClose').addEventListener('click', close);
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    form.addEventListener('submit', submit);
    input.addEventListener('input', function () { err.classList.remove('show'); });
  })();
</script>

</body>
</html>
